name: Posea Audio Multi-Platform Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ==========================================
  # WINDOWS BUILD (.exe, .zip, .msi)
  # ==========================================
  build-windows:
    name: Build Windows (x64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Generate Icon Assets
        shell: pwsh
        run: |
          pip install Pillow
          python scripts/generate_icons.py

      - name: Package Windows (.exe, .zip, .msi)
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_NAME) { $env:GITHUB_REF_NAME.TrimStart('v') } else { "1.0.0" }
          .\scripts\package_windows.ps1 -Version $tag

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*.zip
            dist/*.msi

  # ==========================================
  # MACOS BUILD (.app, .dmg)
  # ==========================================
  build-macos:
    name: Build macOS (Universal)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Generate Icon Assets
        run: |
          python3 -m pip install Pillow
          python3 scripts/generate_icons.py

      - name: Package macOS (.dmg)
        run: |
          TAG=${GITHUB_REF_NAME#v}
          [ -z "$TAG" ] && TAG="1.0.0"
          chmod +x scripts/package_macos.sh
          ./scripts/package_macos.sh "$TAG"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*.dmg

  # ==========================================
  # LINUX BUILD (.deb, .tar.gz)
  # ==========================================
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libgtk-3-dev libx11-dev

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      - name: Generate Icon Assets
        run: |
          python3 -m pip install Pillow
          python3 scripts/generate_icons.py

      - name: Package Linux (.deb, .tar.gz)
        run: |
          TAG=${GITHUB_REF_NAME#v}
          [ -z "$TAG" ] && TAG="1.0.0"
          chmod +x scripts/package_linux.sh
          ./scripts/package_linux.sh "$TAG"

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            dist/*.deb
            dist/*.tar.gz

  # ==========================================
  # PUBLISH GITHUB RELEASE
  # ==========================================
  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist

      - name: Consolidate Release Files
        run: |
          mkdir -p release_assets
          find all-dist -type f \( -name "*.zip" -o -name "*.msi" -o -name "*.dmg" -o -name "*.deb" -o -name "*.tar.gz" \) -exec cp {} release_assets/ \;
          ls -lh release_assets/

      - name: Create Official GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release_assets/*
          generate_release_notes: true
          draft: false
          prerelease: false
