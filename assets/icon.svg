<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181924" />
      <stop offset="100%" stop-color="#101117" />
    </linearGradient>

    <!-- Crimson Outer Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Wave Gradients -->
    <linearGradient id="barGradCenter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF7A9C" />
      <stop offset="50%" stop-color="#FF2A55" />
      <stop offset="100%" stop-color="#C8143C" />
    </linearGradient>

    <linearGradient id="barGradMid" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF5C82" />
      <stop offset="50%" stop-color="#FF3360" />
      <stop offset="100%" stop-color="#B51035" />
    </linearGradient>

    <linearGradient id="barGradOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E6305C" />
      <stop offset="50%" stop-color="#D11B45" />
      <stop offset="100%" stop-color="#8E0C28" />
    </linearGradient>
  </defs>

  <!-- Ambient Glow -->
  <rect x="30" y="30" width="452" height="452" rx="106" fill="none" stroke="#FF2A55" stroke-width="8" opacity="0.2" filter="url(#glow)" />

  <!-- Main Squircle Body -->
  <rect x="24" y="24" width="464" height="464" rx="106" fill="url(#bgGrad)" stroke="#FF2A55" stroke-width="4.5" />
  <rect x="31" y="31" width="450" height="450" rx="100" fill="none" stroke="#2E3142" stroke-width="2" />

  <!-- 5 Equalizer Wave Bars -->
  <!-- Bar 1 (Left Outer) -->
  <rect x="121" y="204" width="30" height="104" rx="15" fill="url(#barGradOuter)" />

  <!-- Bar 2 (Left Mid) -->
  <rect x="181" y="146" width="30" height="220" rx="15" fill="url(#barGradMid)" />

  <!-- Bar 3 (Center Peak) -->
  <rect x="240" y="96" width="32" height="320" rx="16" fill="url(#barGradCenter)" />

  <!-- Bar 4 (Right Mid) -->
  <rect x="301" y="146" width="30" height="220" rx="15" fill="url(#barGradMid)" />

  <!-- Bar 5 (Right Outer) -->
  <rect x="361" y="204" width="30" height="104" rx="15" fill="url(#barGradOuter)" />

  <!-- Apex Shine Dot -->
  <circle cx="256" cy="104" r="6" fill="#FFFFFF" opacity="0.9" />
</svg>
